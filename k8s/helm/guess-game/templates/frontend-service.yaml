apiVersion: v1
kind: Service
metadata:
  name: {{ include "guess-game.fullname" . }}-frontend
  labels:
    {{- include "guess-game.labels" . | nindent 4 }}
    {{- include "guess-game.frontend.selectorLabels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "guess-game.frontend.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.frontend.port }}
      targetPort: {{ .Values.frontend.port }}
      nodePort: {{ .Values.frontend.nodePort }}
      protocol: TCP
